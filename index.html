<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" id="app-theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<title>דיווח עבודות · פק״ע תייקום</title>
<meta name="apple-mobile-web-app-title" content="פק״ע תייקום">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<style>
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --card-glass: rgba(255, 255, 255, 0.80);
  --fill: rgba(118, 118, 128, 0.11);
  --fill-hover: rgba(118, 118, 128, 0.18);
  --tx: #000000;
  --tx2: #8E8E93;
  --tx3: #3C3C43;
  --ac: #007AFF;
  --ac2: #5AC8FA;
  --ac-soft: rgba(0, 122, 255, 0.12);
  --ok: #34C759;
  --ok-soft: rgba(52, 199, 89, 0.14);
  --warn: #FF9500;
  --warn-soft: rgba(255, 149, 0, 0.14);
  --er: #FF3B30;
  --er-soft: rgba(255, 59, 48, 0.12);
  --sep: rgba(60, 60, 67, 0.15);
  --ring: 0 0 0 0.5px var(--sep);
  --shadow: 0 6px 26px rgba(0, 0, 0, 0.045), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-btn: 0 6px 18px rgba(0, 122, 255, 0.28);
  --shadow-ok: 0 6px 18px rgba(52, 199, 89, 0.28);
  --glow-1: rgba(90, 200, 250, 0.26);
  --glow-2: rgba(255, 184, 120, 0.18);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --card: #1C1C1E;
    --card-glass: rgba(28, 28, 30, 0.80);
    --fill: rgba(118, 118, 128, 0.24);
    --fill-hover: rgba(118, 118, 128, 0.34);
    --tx: #FFFFFF;
    --tx2: #8E8E93;
    --tx3: #EBEBF5;
    --ac: #0A84FF;
    --ac2: #64D2FF;
    --ac-soft: rgba(10, 132, 255, 0.18);
    --ok: #30D158;
    --ok-soft: rgba(48, 209, 88, 0.18);
    --warn: #FF9F0A;
    --warn-soft: rgba(255, 159, 10, 0.18);
    --er: #FF453A;
    --er-soft: rgba(255, 69, 58, 0.18);
    --sep: rgba(84, 84, 88, 0.45);
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.42);
    --shadow-btn: 0 6px 18px rgba(10, 132, 255, 0.32);
    --shadow-ok: 0 6px 18px rgba(48, 209, 88, 0.32);
    --glow-1: rgba(10, 132, 255, 0.24);
    --glow-2: rgba(255, 140, 80, 0.08);
  }
}

:root[data-theme="dark"] {
  --bg: #000000;
  --card: #1C1C1E;
  --card-glass: rgba(28, 28, 30, 0.80);
  --fill: rgba(118, 118, 128, 0.24);
  --fill-hover: rgba(118, 118, 128, 0.34);
  --tx: #FFFFFF;
  --tx2: #8E8E93;
  --tx3: #EBEBF5;
  --ac: #0A84FF;
  --ac2: #64D2FF;
  --ac-soft: rgba(10, 132, 255, 0.18);
  --ok: #30D158;
  --ok-soft: rgba(48, 209, 88, 0.18);
  --warn: #FF9F0A;
  --warn-soft: rgba(255, 159, 10, 0.18);
  --er: #FF453A;
  --er-soft: rgba(255, 69, 58, 0.18);
  --sep: rgba(84, 84, 88, 0.45);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.42);
  --shadow-btn: 0 6px 18px rgba(10, 132, 255, 0.32);
  --shadow-ok: 0 6px 18px rgba(48, 209, 88, 0.32);
  --glow-1: rgba(10, 132, 255, 0.24);
  --glow-2: rgba(255, 140, 80, 0.08);
}

* {
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior-y: none;
  height: 100%;
  height: 100dvh;
}

body {
  margin: 0;
  min-height: 100%;
  min-height: 100dvh;
  background:
    radial-gradient(75% 320px at 15% -40px, var(--glow-1), transparent 70%) no-repeat,
    radial-gradient(65% 300px at 88% -20px, var(--glow-2), transparent 70%) no-repeat,
    var(--bg);
  color: var(--tx);
  font-family: "Rubik", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  font-size: 17px;
  line-height: 1.42;
  letter-spacing: -0.012em;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(36px + env(safe-area-inset-bottom, 0px));
}

button, input, textarea, select {
  font-family: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.nav-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--card-glass);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid var(--sep);
  padding-top: env(safe-area-inset-top, 0px);
}

.nav-inner {
  max-width: 560px;
  margin: 0 auto;
  height: 52px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.nav-back {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--ac);
  font-size: 16px;
  font-weight: 500;
  padding: 8px 4px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.nav-back:active { opacity: 0.45; }
.nav-back svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.4; fill: none; }

.nav-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-step {
  font-size: 13px;
  font-weight: 600;
  color: var(--ac);
  background: var(--ac-soft);
  padding: 4px 10px;
  border-radius: 99px;
  font-variant-numeric: tabular-nums;
}

.theme-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--fill);
  color: var(--tx);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s;
}
.theme-btn:active {
  transform: scale(0.92);
  background: var(--fill-hover);
}
.theme-btn.auto-active {
  color: var(--ac);
  box-shadow: inset 0 0 0 1.5px var(--ac);
}
.theme-controls {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: 0 0 auto;
}

.pb {
  height: 3px;
  background: var(--fill);
  width: 100%;
  overflow: hidden;
}
.pb i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--ac), var(--ac2));
  border-radius: 0 3px 3px 0;
  transition: width 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}

#app {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.home-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--tx2);
  background: var(--card);
  padding: 6px 12px;
  border-radius: 99px;
  box-shadow: var(--ring), var(--shadow);
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 3px var(--ok-soft);
}

.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 20px 8px 20px;
}

.app-icon {
  width: 86px;
  height: 86px;
  border-radius: 26px;
  background: linear-gradient(150deg, #64D2FF 0%, #0A84FF 48%, #0040DD 100%);
  box-shadow: 0 18px 38px rgba(0, 100, 255, 0.30), inset 0 1.5px 1px rgba(255, 255, 255, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  color: #fff;
}
.app-icon svg {
  width: 42px;
  height: 42px;
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.22));
}

.hero h1 {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 6px;
}

.hero .sub {
  font-size: 16px;
  color: var(--tx2);
  max-width: 320px;
  margin: 0 0 24px;
}

.hero-actions {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.install-banner {
  background: var(--ac-soft);
  border: 1px solid rgba(0, 122, 255, 0.2);
  border-radius: 20px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  text-align: right;
  box-shadow: var(--shadow);
  transition: transform 0.14s;
}
.install-banner:active { transform: scale(0.98); }
.install-banner .ib-txt { min-width: 0; }
.install-banner .ib-title { font-weight: 700; font-size: 15px; color: var(--ac); margin-bottom: 2px; }
.install-banner .ib-sub { font-size: 13px; color: var(--tx2); }

.step-header {
  padding: 6px 4px 14px;
}
.step-header h2 {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 0;
}
.step-header .step-sub {
  font-size: 14px;
  color: var(--tx2);
  margin-top: 4px;
}

.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 24px 4px 12px;
}
.sec-head h3 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.count-pill {
  font-size: 13px;
  font-weight: 700;
  background: var(--ac-soft);
  color: var(--ac);
  padding: 2px 10px;
  border-radius: 99px;
  font-variant-numeric: tabular-nums;
}

.card {
  background: var(--card);
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--ring), var(--shadow);
}

.field-group {
  margin-bottom: 20px;
}
.field-group:last-child {
  margin-bottom: 2px;
}

.lb {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 600;
  font-size: 13px;
  color: var(--tx2);
  margin: 0 0 8px 2px;
}
.lb .req {
  color: #FF3B30;
  margin-right: 4px;
  font-weight: 700;
}
.lb .done-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ok);
  background: var(--ok-soft);
  padding: 2px 9px;
  border-radius: 99px;
}

input, textarea {
  width: 100%;
  font-size: 17px;
  color: var(--tx);
  background: var(--fill);
  border: 1.5px solid transparent;
  border-radius: 14px;
  padding: 13px 16px;
  transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
  outline: none;
}
input:focus, textarea:focus {
  background: var(--card);
  border-color: var(--ac);
  box-shadow: 0 0 0 3.5px var(--ac-soft);
}
textarea {
  min-height: 96px;
  resize: vertical;
}
input[type=date] {
  display: block;
  -webkit-appearance: none;
  appearance: none;
  min-width: 0;
  max-width: 100%;
  min-height: 50px;
  text-align: right;
}
input::-webkit-date-and-time-value {
  text-align: right;
}

.search-box {
  position: relative;
  margin-bottom: 10px;
}
.search-box svg {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--tx2);
  pointer-events: none;
}
.search-box input {
  padding-right: 42px;
  background: var(--card);
  box-shadow: var(--ring), var(--shadow);
  border-radius: 15px;
  font-size: 16px;
}

.filter-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 12px;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }

.pill-btn {
  flex: 0 0 auto;
  border: none;
  border-radius: 99px;
  padding: 7px 14px;
  font-size: 14px;
  font-weight: 600;
  background: var(--card);
  color: var(--tx3);
  box-shadow: var(--ring);
  cursor: pointer;
  transition: all 0.15s;
}
.pill-btn.on {
  background: var(--ac);
  color: #FFFFFF;
  box-shadow: 0 4px 12px var(--ac-soft);
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.015em;
  border: 0;
  border-radius: 16px;
  padding: 15px 18px;
  cursor: pointer;
  width: 100%;
  min-height: 54px;
  background: var(--ac);
  color: #FFFFFF;
  box-shadow: var(--shadow-btn), inset 0 1px 0 rgba(255, 255, 255, 0.24);
  transition: transform 0.13s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.15s, background 0.15s;
}
.btn:active {
  transform: scale(0.975);
  opacity: 0.9;
}
.btn:disabled {
  opacity: 0.55;
  transform: none;
}
.btn.ok {
  background: var(--ok);
  box-shadow: var(--shadow-ok), inset 0 1px 0 rgba(255, 255, 255, 0.24);
}
.btn.sec {
  background: var(--card);
  color: var(--ac);
  box-shadow: var(--ring), var(--shadow);
  font-weight: 600;
}
.btn.ghost {
  background: var(--fill);
  color: var(--ac);
  box-shadow: none;
  font-weight: 600;
}
.btn.danger {
  background: var(--er-soft);
  color: var(--er);
  box-shadow: none;
}

.actions-stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 8px;
}

.ch {
  display: flex;
  flex-direction: column;
  background: var(--fill);
  border-radius: 16px;
  overflow: hidden;
}
.ch .bt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 16px;
  font-weight: 500;
  background: transparent;
  color: var(--tx);
  border: 0;
  border-bottom: 0.5px solid var(--sep);
  border-radius: 0;
  padding: 14px 16px;
  min-height: 52px;
  cursor: pointer;
  text-align: right;
  transition: background 0.15s;
}
.ch .bt:last-child { border-bottom: 0; }
.ch .bt:active { background: var(--fill-hover); }
.ch .bt.on {
  background: transparent;
  color: var(--tx);
  font-weight: 600;
}
.ch .bt.on > span:first-child { color: var(--ac); }
.ch .bt .chk {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--ac);
}
.ch .bt.multi .chk {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--tx2);
}
.ch .bt.multi.on .chk {
  background: var(--ac);
  border-color: var(--ac);
  color: #fff;
}

.cn {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}
.cn .bt {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 13px;
  background: var(--fill);
  color: var(--tx);
  min-height: 46px;
  font-size: 16px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: all 0.15s;
}
.cn .bt:active { transform: scale(0.95); }
.cn .bt.on {
  background: var(--ac);
  color: #fff;
  box-shadow: 0 4px 12px var(--ac-soft);
}

.rw {
  background: var(--bg);
  border-radius: 18px;
  padding: 15px 16px;
  margin-bottom: 10px;
  box-shadow: var(--ring);
}
.rw:last-child { margin-bottom: 0; }
.rw > .t {
  color: var(--ac);
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 10px;
}

.th {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}
.tm {
  position: relative;
  width: 84px;
  height: 84px;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
  cursor: pointer;
}
.tm img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 14px;
}
.dl {
  position: absolute;
  top: -7px;
  left: -7px;
  width: 26px;
  height: 26px;
  border-radius: 13px;
  border: 2px solid var(--card);
  background: var(--er);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
}

.r2 {
  display: flex;
  gap: 10px;
}
.r2 .btn {
  margin: 0;
  padding: 12px;
  min-height: 46px;
  font-size: 15px;
}

.err {
  background: var(--er-soft);
  border: 1px solid rgba(255, 59, 48, 0.25);
  color: var(--er);
  border-radius: 18px;
  padding: 14px 16px;
  margin-bottom: 14px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.55;
}

.ln {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 0.5px solid var(--sep);
  font-size: 15px;
}
.ln:last-child { border-bottom: none; padding-bottom: 2px; }
.ln:first-child { padding-top: 2px; }
.ln span:first-child { color: var(--tx2); flex-shrink: 0; }
.ln span:last-child { font-weight: 600; text-align: left; word-break: break-word; }

.saved-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--ok-soft);
  border-radius: 18px;
  padding: 14px 16px;
  margin-bottom: 16px;
}
.saved-icon {
  width: 36px;
  height: 36px;
  border-radius: 18px;
  background: var(--ok);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.sub-muted {
  color: var(--tx2);
  font-size: 13px;
}

.draft {
  background: var(--card);
  border-radius: 22px;
  padding: 16px;
  box-shadow: var(--ring), var(--shadow);
  text-align: right;
}
.draft-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.draft-ic {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: var(--warn-soft);
  color: var(--warn);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.draft-tx { min-width: 0; flex: 1; }
.draft-k { font-size: 12px; font-weight: 700; color: var(--warn); }
.draft-t { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.draft-act { display: flex; gap: 10px; }
.draft-act .btn { min-height: 46px; font-size: 15px; border-radius: 14px; }
.draft-act .del { width: auto; flex: 0 0 auto; padding: 12px 18px; color: var(--er); }

.work-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.work-card {
  background: var(--card);
  border-radius: 22px;
  padding: 16px 18px;
  box-shadow: var(--ring), var(--shadow);
  cursor: pointer;
  transition: transform 0.14s ease, background 0.15s ease;
}
.work-card:active {
  transform: scale(0.985);
}

.wc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.co-tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;

  copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  sun: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  phone: '<rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>'
};

const f = (k, t, l, x = {}) => ({ k, t, l, ...x });
const lab = (x, o) => typeof x.l === 'function' ? x.l(o) : x.l;
const SP = ['1:4', '1:8', '1:16', '1:32'];
const CB = ['12', '36', '48', '72', '96', '288'];
const PH = a => a.map(l => f('ph:' + l, 'photo', l));
// תמונות עם מפתח ייחודי לכל קבוצה (כדי שאותה כותרת בשלבים שונים לא תשתף תמונות)
const PHG = (g, a, show, pre = '') => a.map(l => f('ph:' + g + ':' + l, 'photo', pre + l, show ? { show } : {}));
const isUni = () => S.co === 'UNIGAEA';
// מספר ארונית: חובה רק בהוט; בשאר החברות אופציונלי (נקבע לפי החברה שנבחרה ברגע הבדיקה)
// ב-HOT (שלא בתחזוקה) מותר להזין גם מקף (-) במספר הארונית
const cabNum = (k, l, x = {}) => ({ ...f(k, 'num', l, x), get opt() { return S.co !== 'HOT'; }, get dash() { return S.co === 'HOT' && S.wk !== 'תחזוקה'; }, get ph() { return this.dash ? 'ניתן להזין גם מקף (-)' : ''; } });
const WK_ACT = 'הפעלה בלבד';
// תמונות חובה בהפעלה – בכל מקום שבו יש הפעלה. לכל קטגוריה לפחות תמונה אחת, וניתן להוסיף עוד
const ACT6 = ['בדיקת עוצמות בצב״ד', 'סיום הפעלה מהצב״ד', 'מד אור עם דמוקס', 'ארון פתוח', 'ארון סגור עם מדבקה', 'צילום ארון מרחוק'];
const ACTPH = (g, show, pre = '') => ACT6.map(l => ({ ...f('ph:' + g + ':' + l, 'photo', pre + l, show ? { show } : {}), grp: 'act' }));
const CL_PH = ['תמונת קלוז׳ר', 'תמונת מגש היתוכים', 'תמונת סל איסוף', 'צילום כבלים בקלוז׳ר', 'צילום מרחוק של הקלוז׳ר'];
const NOTES = { title: 'הערות', fields: [f('notes', 'area', 'טקסט חופשי', { opt: 1 })] };
const NOTES_ACT = { title: 'הערות', fields: [f('notes', 'area', 'טקסט חופשי', { opt: 1, grp: 'act' })] };
const has = v => () => (S.acts || []).includes(v);

const PNL = () => [
  { title: 'פרטי פנל', fields: [f('pnlSize', 'choice', 'גודל פנל', { o: ['12', '24', '48', '72', '96', '144', '288'] })] },
  { title: 'תמונות', fields: PH(['תמונה של פנל כולל מדבקה', 'צילום ארון מרחוק']) },
  NOTES
];

const CL = () => [
  { title: 'מיקום', fields: [f('loc', 'choice', 'גוב או עמוד', { o: ['גוב', 'עמוד', 'אחר'] }), f('locNum', 'num', () => 'מספר ' + S.loc, { show: () => S.loc === 'גוב' || S.loc === 'עמוד' }), f('locO', 'text', 'פירוט מיקום (אחר)', { show: () => S.loc === 'אחר' })] },
  { title: 'סוג קלוז׳ר', fields: [f('ct', 'choice', 'סוג קלוז׳ר', { o: ['קטן', 'בינוני', 'גדול', 'פתיחה סגירה'] }), f('ctFor', 'text', 'פתיחה סגירה עבור', { show: () => S.ct === 'פתיחה סגירה' })] },
  { title: 'היתוכים וכבלים', fields: [f('fus', 'num', 'כמות היתוכים בקלוז׳ר'), f('nc', 'count', 'כמות הכנסת כבלים'), f('cables', 'rows', 'כבל', { n: 'nc', cols: [f('t', 'choice', 'סוג כבל', { o: CB }), f('n', 'num', 'מספר כבל')] })] },
  { title: 'תמונות', fields: PH(isUni() && S.wk === 'ציר הזנה' ? [...CL_PH, 'צילום מדבקת מספר UNIGAEA'] : CL_PH) },
  NOTES
];

const CAB = () => [
  { title: 'פרטי ארונית', fields: [cabNum('cab', 'מספר ארונית'), f('cl', 'choice', 'מיקום ארונית', { o: ['חיצוני', 'פנימי'] }), f('ext', 'choice', 'מיקום חיצוני', { o: ['פילר', 'עמוד', 'חזית', 'עורף', 'אחר'], show: () => S.cl === 'חיצוני' }), f('extNum', 'num', 'מספר עמוד', { show: () => S.cl === 'חיצוני' && S.ext === 'עמוד' }), f('extPil', 'num', 'מספר פילר', { show: () => S.cl === 'חיצוני' && S.ext === 'פילר' }), f('extO', 'text', 'פירוט', { show: () => S.cl === 'חיצוני' && S.ext === 'אחר' }), f('it', 'choice', 'סוג מיקום', { o: ['PPC', 'LSB'], show: () => S.cl === 'פנימי' }), f('fl', 'text', 'קומה', { show: () => S.cl === 'פנימי' })] },
  { title: 'היתוכים ומפצלים', fields: [f('fus', 'num', 'מספר היתוכים'), f('ns', 'count', 'כמות מפצלים'), f('spl', 'rows', 'מפצל', { n: 'ns', cols: [f('t', 'choice', 'סוג מפצל', { o: [...SP, 'Pigtail'] })] })] },
  { title: 'הפעלה', fields: [f('act', 'choice', 'הפעלה', { o: ['כולל הפעלה', 'לא כולל הפעלה'], grp: 'both' })] },
  { title: 'תמונות', fields: [...PH(['תמונה מרחוק', 'תמונה מקרוב']), ...ACTPH('cab', () => S.act === 'כולל הפעלה')] },
  NOTES
];

const ACT_YN = ['כולל הפעלה', 'לא כולל הפעלה'];
// שלב תמונות לפי פעולה: תמונה מרחוק + מקרוב, ובמקרה של "כולל הפעלה" גם צב״ד ומד אור – הכל חובה
const actPhotoStep = (act, key, g) => ({
  title: 'תמונות – ' + act,
  fields: [
    ...PHG(g, ['תמונה מרחוק', 'תמונה מקרוב'], null, act + ' – '),
    ...ACTPH(g, () => S[key] === 'כולל הפעלה', act + ' – ')
  ]
});

const MT = () => {
  const uni = isUni();
  const a = [];
  // סוגי תחזוקה לפי חברה: HOT – תקלות/הרחבות · IBC ו-RIMON – גם העתקות · UNIGAEA – תקלות/העתקות
  const subO = uni ? ['תקלות', 'העתקות'] : S.co === 'HOT' ? ['תקלות', 'הרחבות'] : ['תקלות', 'הרחבות', 'העתקות'];
  a.push({ title: 'סוג תחזוקה', fields: [f('sub', 'choice', 'סוג תחזוקה', { o: subO })] });
  if (S.sub === 'העתקות') a.push(...CL());   // העתקות = קלוז׳ר בלבד (בלי בחירת ארונית)
  if (S.sub === 'תקלות') {
    const acts = S.acts || [];
    a.push(
      { title: 'פרטי תקלה', fields: [...(uni ? [] : [f('tk', 'num', 'מספר טיקט')]), f('ft', 'choice', 'סוג תקלה', { o: uni ? ['תקלת עוצמות'] : ['תקלת עוצמות', 'Optical issue'] })] },
      { title: 'פעולות לביצוע', fields: [
        f('acts', 'multi', 'בחירת פעולות (ניתן לבחור כמה)', { o: uni ? ['תיקון בארונית', 'החלפת מפצל', 'פתיחת קלוז׳רים'] : ['תיקון בארונית', 'החלפת מפצל', 'החלפת Pigtail', 'פתיחת קלוז׳רים'] }),
        cabNum('fCab', 'מספר ארונית', { show: has('תיקון בארונית') }),
        f('fFus', 'num', 'כמות היתוכים', { show: has('תיקון בארונית') }),
        f('fcl', 'choice', 'מיקום ארונית', { o: ['חיצוני', 'פנימי'], show: has('תיקון בארונית') }),
        f('fext', 'choice', 'מיקום חיצוני', { o: ['פילר', 'עמוד', 'חזית', 'עורף', 'אחר'], show: () => has('תיקון בארונית')() && S.fcl === 'חיצוני' }),
        f('fPole', 'num', 'מספר עמוד', { show: () => has('תיקון בארונית')() && S.fcl === 'חיצוני' && S.fext === 'עמוד' }),
        f('fextO', 'text', 'פירוט', { show: () => has('תיקון בארונית')() && S.fcl === 'חיצוני' && S.fext === 'אחר' }),
        f('aCab', 'choice', 'תיקון בארונית – הפעלה', { o: ACT_YN, show: has('תיקון בארונית'), grp: 'both' }),
        f('fSp', 'choice', 'סוג מפצל', { o: SP, show: has('החלפת מפצל') }),
        f('aSpl', 'choice', 'החלפת מפצל – הפעלה', { o: ACT_YN, show: has('החלפת מפצל'), grp: 'both' }),
        f('aPig', 'choice', 'החלפת Pigtail – הפעלה', { o: ACT_YN, show: has('החלפת Pigtail'), grp: 'both' }),
        f('nK', 'count', 'כמות קלוז׳רים שנפתחו', { show: has('פתיחת קלוז׳רים') }),
        f('cls', 'rows', 'קלוז׳ר', { n: 'nK', show: has('פתיחת קלוז׳רים'), cols: [f('n', 'num', 'מספר קלוז׳ר'), f('fus', 'num', 'כמות היתוכים')] })
      ] }
    );
    if (acts.includes('תיקון בארונית')) a.push(actPhotoStep('תיקון בארונית', 'aCab', 'pc'));
    if (acts.includes('החלפת מפצל')) a.push(actPhotoStep('החלפת מפצל', 'aSpl', 'ps'));
    if (!uni && acts.includes('החלפת Pigtail')) a.push(actPhotoStep('החלפת Pigtail', 'aPig', 'pp'));
    if (acts.includes('פתיחת קלוז׳רים')) a.push({
      title: 'תמונות – פתיחת קלוז׳רים',
      fields: PHG('pk', uni ? [...CL_PH, 'צילום מדבקת מספר UNIGAEA'] : CL_PH)
    });
    a.push(NOTES);
  }
  if (S.sub === 'הרחבות') a.push(
    { title: 'פרטי הרחבה', fields: [f('tk', 'num', 'מספר טיקט'), f('ne', 'count', 'כמות מפצלים קיימים לפני הרחבה'), f('ex', 'rows', 'מפצל קיים', { n: 'ne', cols: [f('t', 'choice', 'סוג מפצל', { o: SP })] }), f('nsp', 'choice', 'סוג מפצל שנוסף', { o: SP })] },
    { title: 'פתיחת ארונית', fields: [f('ic', 'choice', 'פתיחת ארונית', { o: ['כולל', 'לא כולל'] }), f('nCab', 'count', 'כמות ארוניות שנפתחו', { show: () => S.ic === 'כולל' }), f('cabs', 'rows', 'ארונית', { n: 'nCab', show: () => S.ic === 'כולל', cols: [cabNum('n', 'מספר ארונית'), f('fus', 'num', 'כמות היתוכים')] })] },
    { title: 'פתיחת קלוז׳רים', fields: [f('ik', 'choice', 'פתיחת קלוז׳רים', { o: ['כולל', 'לא כולל'] }), f('nK2', 'count', 'כמות קלוז׳רים שנפתחו', { show: () => S.ik === 'כולל' }), f('cls2', 'rows', 'קלוז׳ר', { n: 'nK2', show: () => S.ik === 'כולל', cols: [f('i', 'choice', 'תשתית', { o: ['גוב', 'עמוד'] }), f('n', 'num', r => 'מספר ' + (r.i || 'גוב/עמוד'), { show: r => r.i }), f('fus', 'num', 'כמות היתוכים')] })] },
    { title: 'תמונות וקבצים', fields: PH(['תמונות']) },
    NOTES
  );
  return a;
};

// התאמת בחירות כשמחליפים חברה (UNIGAEA: "לקוח עסקי" במקום "הקמות", בלי "הפעלות" ובלי Pigtail)
const normalizeS = () => {
  if (S.wk === 'הפעלות') S.wk = WK_ACT;                        // שינוי שם: "הפעלות" ← "הפעלה בלבד"
  const lockedCn = (getSess() || {}).contractor;
  if (lockedCn) S.contractor = lockedCn;                       // שם הקבלן נקבע לפי המשתמש המחובר
  if (S.wk === 'תחזוקה' && S.sub === 'העתקות') S.ks = 'קלוז׳ר';   // העתקות = קלוז׳ר בלבד
  if (S.acts && S.acts.includes('החלפת פיקטל')) S.acts = S.acts.map(x => x === 'החלפת פיקטל' ? 'החלפת Pigtail' : x);
  if (isUni()) {
    if (S.wk === 'הקמות') S.wk = 'לקוח עסקי';
    if (S.wk === WK_ACT) delete S.wk;                          // ביוניגאה אין "הפעלה בלבד"
    if (S.ft === 'Optical issue') delete S.ft;
    if (S.wk === 'לקוח עסקי' && S.ks === 'התקנת פנל') { S.wk = 'התקנת פנל'; delete S.ks; }
    if (S.wk === 'תחזוקה' && S.sub === 'הרחבות') delete S.sub;
    if (S.acts && S.acts.includes('החלפת Pigtail')) S.acts = S.acts.filter(x => x !== 'החלפת Pigtail');
  } else {
    if (S.wk === 'תחזוקה' && S.co === 'HOT' && S.sub === 'העתקות') delete S.sub;   // ב-HOT אין העתקות
    if (S.wk === 'לקוח עסקי') S.wk = 'הקמות';
    if (S.wk === 'התקנת פנל') { S.wk = 'הקמות'; S.ks = 'התקנת פנל'; }
  }
};

const steps = () => {
  normalizeS();
  const uni = isUni(), build = S.wk === 'הקמות' || S.wk === 'לקוח עסקי';
  return [
  { title: 'פרטים ראשוניים', fields: [f('contractor', 'text', 'קבלן מבצע', { get ro() { return !!(getSess() || {}).contractor; } }), f('date', 'date', 'תאריך ביצוע'), f('project', 'text', 'שם פרויקט'), f('city', 'city', 'עיר'), f('address', 'addr', 'כתובת')] },
  { title: 'בחירת חברה', fields: [f('co', 'choice', 'חברה', { o: ['IBC', 'HOT', 'UNIGAEA', 'RIMON'] })] },
  { title: 'סוג עבודה', fields: [f('wk', 'choice', 'סוג עבודה', { o: uni ? ['לקוח עסקי', 'התקנת פנל', 'תחזוקה', 'ציר הזנה'] : ['הקמות', 'תחזוקה', 'ציר הזנה', WK_ACT] })] },
  ...(build ? [{ title: S.wk, fields: [f('ks', 'choice', 'מה הוקם?', { o: uni ? ['קלוז׳ר', 'ארונית'] : ['קלוז׳ר', 'ארונית', 'התקנת פנל'] })] }, ...(S.ks === 'קלוז׳ר' ? CL() : S.ks === 'ארונית' ? CAB() : S.ks === 'התקנת פנל' ? PNL() : [])] : S.wk === 'תחזוקה' ? MT() : S.wk === 'ציר הזנה' ? CL() : S.wk === 'התקנת פנל' ? PNL() : S.wk === WK_ACT ? [CAB()[0], { title: 'תמונות הפעלה', fields: ACTPH('hp') }, NOTES_ACT] : [])
  ];

const addrCache = {};
async function fetchAddr(q) {
  if (addrCache[q]) return addrCache[q];
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&accept-language=he&countrycodes=il&limit=8&q=' + encodeURIComponent(q));
  if (!r.ok) throw new Error('addr');
  const j = await r.json(), seen = new Set(), out = [];
  j.forEach(p => {
    const a = p.address || {}, road = a.road || a.pedestrian || a.footway || a.path;
    if (!road) return;
    const v = road + (a.house_number ? ' ' + a.house_number : '');
    if (!seen.has(v)) { seen.add(v); out.push(v); }
  });
  return (addrCache[q] = out);
}
function suggestBox(ip, x, o, fv) {

    box.style.display = items.length || hint ? 'block' : 'none';
  };
  const upd = () => {
    const t = ip.value.trim();
    clearTimeout(tm);
    if (x.t === 'city') {
      const all = [...new Set(CITY_LIST)];
      if (!t) { render(all); return; }            // שדה ריק: כל הרשימה, עם גלילה
      const n = normCity(t);
      const pre = all.filter(c => normCity(c).startsWith(n)), sub = all.filter(c => !normCity(c).startsWith(n) && normCity(c).includes(n));
      render([...pre, ...sub].slice(0, 80));
    } else {
      if (t.length < 3) { hide(); return; }

      tm = setTimeout(async () => {

function need(fs, o, out, pre = '') {

function shrink(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1000 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = im.width * k;
      c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    im.onerror = () => toast('לא ניתן לטעון את התמונה');
    im.src = r.result;
  };
  r.readAsDataURL(file);
}

function stepProg(s) {
  let t = 0, d = 0;
  (function w(fs, o) {
    for (const x of fs) {
      if (!vis(x, o) || x.opt) continue;
      const v = o[x.k];
      if (x.t === 'rows') {
        const n = S[x.n] || 0;
        for (let j = 0; j < n; j++) w(x.cols, (v || [])[j] || {});
      } else {
        t++;
        if (x.t === 'photo' || x.t === 'multi') { if (v && v.length) d++; }
        else if (x.t === 'count') { if (v !== undefined && v !== null && v !== '') d++; }
        else if (v && String(v).trim()) d++;
      }
    }
  })(s.fields, S);
  return { t, d };
}

}

function lines(stateObj = S) {
  const out = [], ph = [];
  const origS = { ...S };
  if (stateObj !== S) {
    Object.keys(S).forEach(k => delete S[k]);
    Object.assign(S, stateObj);
  }
  const activeSteps = steps();
  if (stateObj !== S) {
    Object.keys(S).forEach(k => delete S[k]);
    Object.assign(S, origS);
  }

  // קבוצת מסמך לכל שורה: gen = פרטים כלליים (בשני ה-PDF), cab = ארון, act = הפעלה, both = בשניהם
  const gmap = new Map();
  activeSteps.forEach((s, si) => s.fields.forEach(x => gmap.set(x, x.grp || (si < 3 ? 'gen' : 'cab'))));
  (function w(fs, o) {
    for (const x of fs) {
      if (!vis(x, o) || x.t === 'count') continue;
      const v = o[x.k], g = gmap.get(x) || 'cab';
      if (x.t === 'rows') (v || []).slice(0, stateObj[x.n] || 0).forEach((r, j) => out.push([x.l + ' ' + (j + 1), x.cols.filter(c => vis(c, r) && r[c.k]).map(c => lab(c, r) + ': ' + r[c.k]).join(' · '), g]));
      else if (x.t === 'photo') { if (v && v.length) { out.push([lab(x, o), v.length + ' תמונות', g]); ph.push([lab(x, o), v, g]); } }
      else if (x.t === 'multi') { if (v && v.length) out.push([lab(x, o), v.join(', '), g]); }
      else if (v) out.push([lab(x, o), v, g]);
    }
  })(activeSteps.flatMap(s => s.fields), stateObj);
  return { out, ph };
}

      sent = uploadedPhotos.length >= photoCount;
      console.log('דיווח ותמונות נשלחו בהצלחה ל-Supabase!');
      if (!(prev && prev.sent)) notifyAdmins('new_report');
    } else {
      console.error('שגיאה בשליחה ל-Supabase:', await supResponse.text());
    }
  } catch (apiError) {
    console.error('בעיית תקשורת מול מסד הנתונים:', apiError);
  }

  const record = {
    id, createdAt, updatedAt: nowStr, ts: Date.now(),
    data: JSON.parse(JSON.stringify(S)), lines: out, photoCount, gps, sig, sent,
    meta: {
      contractor: S.contractor || '', date: S.date || '',
      project: S.project || 'עבודה ללא שם', city: S.city || '',
      address: S.address || '', co: S.co || '', wk: S.wk || '',
      sub: S.ks || S.sub || '', tk: S.tk || ''
    }
  };

  const nextWorks = savedWorks.slice();
  if (existingIdx >= 0) nextWorks[existingIdx] = record;
  else nextWorks.unshift(record);

  try {
    await idb('put', 'saved_works', nextWorks);
  } catch (e) {
    console.error('IndexedDB save failed:', e);
    toast('השמירה נכשלה. הדיווח נשאר פתוח — אין לסגור את הדף עד שתנסה שוב.');
    return false;
  }

  savedWorks = nextWorks;
  saved = { id, at: nowStr };
  editingId = id;

  try {
    const lite = savedWorks.map(({ id, createdAt, updatedAt, ts, lines, photoCount, meta }) => ({
      id, createdAt, updatedAt, ts, lines, photoCount, meta
    }));
    localStorage.setItem('reports_lite', JSON.stringify(lite));
  } catch (e) {}

  try { await idb('del', 'draft'); } catch (e) {}
  try { localStorage.removeItem('draft'); } catch (e) {}
  draft = null;

  toast(sent ? 'העבודה נשמרה באפליקציה ונשלחה לאתר הניהול' : 'העבודה נשמרה באפליקציה. השליחה לאתר לא הושלמה – לחץ שוב על השמירה כשיש קליטה');
  try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
  draw();
  return true;
}

/* ===== התראות Push מהמנהל ===== */
const VAPID_PUBLIC = 'BILvigSt7Oi1CiRG0nLC-uH4W2u83Uumuq0ijuEhZkIJ_H1KWdpFG0fyAmgws2pdWbDN6ue8YVb7OufjErYVXQk';
const pushSupported = () => ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window) && location.protocol === 'https:';
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const urlB64ToU8 = b => { const p = '='.repeat((4 - b.length % 4) % 4), r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
async function getSubFresh(reg) {
  let sub = await reg.pushManager.getSubscription();
  if (sub) {   // הרשמה שנוצרה עם מפתח VAPID ישן – מבטלים ונרשמים מחדש
    try { const cur = sub.options && sub.options.applicationServerKey, want = urlB64ToU8(VAPID_PUBLIC);
      if (cur && (cur.byteLength !== want.length || new Uint8Array(cur).some((v, i) => v !== want[i]))) { await sub.unsubscribe(); sub = null; } } catch (e) {}
  }
  return sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToU8(VAPID_PUBLIC) });
}
// התראה למנהל (דיווח חדש / בקשת איפוס סיסמה) – שקט, לא משפיע על השמירה אם נכשל
async function notifyAdmins(kind) {
  try { const tok = await authToken(); await fetch(SB_URL + '/functions/v1/send-push', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' }, body: JSON.stringify({ event: kind }) }); } catch (e) {}
}
async function savePushSub(sub) {
  const k = sub.toJSON().keys || {}, tok = await authToken();
  if (tok === SB_KEY) return false;
  const r = await fetch(SB_URL + '/rest/v1/push_subscriptions?on_conflict=endpoint', { method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ endpoint: sub.endpoint, p256dh: k.p256dh, auth: k.auth }) });
  return r.ok;
}
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('ההתראות נחסמו. אפשר לאשר אותן בהגדרות המכשיר.'); return false; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await getSubFresh(reg);
    const okSave = await savePushSub(sub);
    toast(okSave ? 'ההתראות הופעלו' : 'ההרשמה לא נשמרה – נסה שוב בחיבור לאינטרנט');
    if (i < 0) draw(true);
    return true;
  } catch (e) { toast('הפעלת ההתראות נכשלה'); return false; }
}
// רישום מחדש שקט (אם כבר אושר) – שומר שההרשמה תקפה ומשויכת למשתמש המחובר
async function refreshPushSub() {
  try {
    if (!pushSupported() || Notification.permission !== 'granted' || !getSess() || navigator.onLine === false) return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await getSubFresh(reg);
    if (sub) await savePushSub(sub);
  } catch (e) {}
}

const PUSH_REQUIRED = true;   // false = בלי חסימה
function pushGate() {

function backupRow() {
  const persist = async () => {
    await idb('put', 'saved_works', savedWorks);

      const lite = savedWorks.map(({ id, createdAt, updatedAt, ts, lines, photoCount, meta }) => ({ id, createdAt, updatedAt, ts, lines, photoCount, meta }));
      localStorage.setItem('reports_lite', JSON.stringify(lite));
    } catch (e) {}
  };

  const exp = async () => {
    if (!savedWorks.length) { toast('אין עבודות שמורות לגיבוי'); return; }
    const blob = new Blob([JSON.stringify({ app: 'work-report', v: 1, exportedAt: new Date().toISOString(), works: savedWorks })], { type: 'application/json' });
    const name = 'backup-' + new Date().toLocaleDateString('sv-SE') + '.json';
    try {
      const fl = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [fl] })) {
        try { await navigator.share({ files: [fl], title: 'גיבוי עבודות' }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
      }
    } catch (e) {}
    dl(blob, name);
  };

  const inp = h('input', {
    type: 'file', accept: '.json,application/json', style: 'display:none',
    onchange: e => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      const r = new FileReader();
      r.onload = async () => {
        try {
          const j = JSON.parse(r.result);
          const arr = Array.isArray(j) ? j : j && j.works;
          if (!Array.isArray(arr)) throw new Error('bad');
          let add = 0, upd = 0;
          for (const w of arr) {
            if (!w || typeof w !== 'object' || typeof w.id !== 'string') continue;
            const k = savedWorks.findIndex(x => x.id === w.id);
            if (k < 0) { savedWorks.push(w); add++; }
            else if ((w.ts || 0) > (savedWorks[k].ts || 0)) { savedWorks[k] = w; upd++; }
          }
          if (!add && !upd) { toast('אין עבודות חדשות בקובץ'); return; }
          savedWorks.sort((a, b) => (b.ts || 0) - (a.ts || 0));
          await persist();
          toast('שוחזרו ' + (add + upd) + ' עבודות');
          draw();
        } catch (err) { toast('קובץ גיבוי לא תקין'); }
      };
      r.onerror = () => toast('לא ניתן לקרוא את הקובץ');
      r.readAsText(f);
    }
  });

  return h('div', { cls: 'backup-row' },
    h('div', { cls: 'sub-muted', style: 'margin-bottom:8px' }, 'העבודות נשמרות על המכשיר בלבד. מומלץ לגבות מדי פעם.'),
    h('div', { cls: 'r2' },
      h('div', { style: 'flex:1' }, h('button', { type: 'button', cls: 'btn ghost', onclick: e => busy(e, exp) }, svgIcon(ICONS.dl, 18), 'גיבוי עבודות')),
      h('div', { style: 'flex:1' }, inp, h('button', { type: 'button', cls: 'btn ghost', onclick: () => inp.click() }, svgIcon(ICONS.folder, 18), 'שחזור מגיבוי'))
    )
  );
}

    const la = wrap(a, 380), lb = wrap(b, W - 2 * M - 420), rh = Math.max(la.length, lb.length) * 36 + 16;

  }

      } catch (e) { x.fillStyle = '#000'; x.font = '24px Arial'; x.fillText('לא ניתן לטעון את התמונה', W - PM, PM + 100); }
      x.font = 'bold 28px Arial';
      const cw = x.measureText(cap).width + 28;
      x.fillStyle = 'rgba(0,0,0,0.62)'; x.fillRect(ix - cw - 10, iy + 10, cw, 46);
      x.fillStyle = '#fff'; x.fillText(cap, ix - 24, iy + 43);
    }
  }
  const N = pages.length, enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const add = b => { const u = typeof b === 'string' ? enc.encode(b) : b; parts.push(u); len += u.length; };
  const obj = (n, fn) => { offs[n] = len; add(n + ' 0 obj\n'); fn(); add('\nendobj\n'); };
  add('%PDF-1.4\n');
  obj(1, () => add('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2, () => add('<</Type/Pages/Count ' + N + '/Kids[' + pages.map((_, k) => (5 + 3 * k) + ' 0 R').join(' ') + ']>>'));
  pages.forEach((p, k) => {
    const j = jpg(p), cs = 'q 595 0 0 842 0 0 cm /I Do Q';
    obj(3 + 3 * k, () => { add('<</Type/XObject/Subtype/Image/Width ' + W + '/Height ' + H + '/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ' + j.length + '>>\nstream\n'); add(j); add('\nendstream'); });
    obj(4 + 3 * k, () => add('<</Length ' + cs.length + '>>\nstream\n' + cs + '\nendstream'));
    obj(5 + 3 * k, () => add('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</I ' + (3 + 3 * k) + ' 0 R>>>>/Contents ' + (4 + 3 * k) + ' 0 R>>'));
  });
  const xr = len, tot = 3 + 3 * N;
  add('xref\n0 ' + tot + '\n0000000000 65535 f \n');
  for (let n = 1; n < tot; n++) add(String(offs[n]).padStart(10, '0') + ' 00000 n \n');
  add('trailer\n<</Size ' + tot + '/Root 1 0 R>>\nstartxref\n' + xr + '\n%%EOF');
  return new Blob(parts, { type: 'application/pdf' });
}

const pcache = new Map();
const getPdf = (out, ph, title) => {
  const k = JSON.stringify([out, ph, title || '']);
  if (!pcache.has(k)) {
    if (pcache.size >= 4) pcache.delete(pcache.keys().next().value);
    const pr = mkPDF(out, ph, title); pr.catch(() => pcache.delete(k)); pcache.set(k, pr);
  }
  return pcache.get(k);
};

// דיווח שכולל גם פרטי ארון וגם הפעלה ← שני מסמכים נפרדים: "PDF ארון" ו"PDF הפעלה" (לא מאוחדים)
function docsOf(out, ph) {
  const hasAct = ph.some(p => p[2] === 'act');
  const hasCab = out.some(l => l[2] === 'cab') || ph.some(p => p[2] === 'cab');
  if (!(hasAct && hasCab)) return [{ name: '', label: '', title: 'דוח ביצוע עבודה', out, ph }];
  const pick = g => ({ out: out.filter(l => l[2] === 'gen' || l[2] === 'both' || l[2] === g), ph: ph.filter(p => p[2] === 'gen' || p[2] === g) });
  return [
    { name: 'ארון', label: 'PDF ארון', title: 'דוח ביצוע עבודה – ארון', ...pick('cab') },
    { name: 'הפעלה', label: 'PDF הפעלה', title: 'דוח ביצוע עבודה – הפעלה', ...pick('act') }
  ];
}
function pdfSet(out, ph, base) {
  const docs = docsOf(out, ph).map(d => ({ ...d, fn: base + (d.name ? '-' + d.name : '') + '.pdf', p: getPdf(d.out, d.ph, d.title) }));
  docs.forEach(d => d.p.catch(() => {}));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const share = async ttl => {
    const blobs = await Promise.all(docs.map(d => d.p)), fls = blobs.map((b, k) => new File([b], docs[k].fn, { type: 'application/pdf' }));
    if (navigator.canShare && navigator.canShare({ files: fls })) {
      try { await navigator.share({ files: fls, title: ttl }); }
      catch (e) {
        if (e && e.name === 'AbortError') return;
        if (e && e.name === 'NotAllowedError') { toast('ה-PDF מוכן, לחצו שוב על שיתוף'); return; }
        throw e;
      }
    } else for (let k = 0; k < blobs.length; k++) { dl(blobs[k], docs[k].fn); if (k < blobs.length - 1) await wait(600); }
  };
  const download = async () => { for (let k = 0; k < docs.length; k++) { dl(await docs[k].p, docs[k].fn); if (k < docs.length - 1) await wait(600); } };
  const saveAs = async d => {
    const handle = await pickHandle(d.fn, 'application/pdf', 'pdf');   // חלון בחירת נתיב נפתח מיד בלחיצה
    const b = await d.p;
    if (handle) { await writeHandle(handle, b); toast('הקובץ נשמר'); } else dl(b, d.fn);
  };
  const many = docs.length > 1;
  const btns = (okFirst, beforeSave) => [
    h('button', { cls: 'btn' + (okFirst ? ' ok' : ''), onclick: e => busy(e, async () => { if (beforeSave) await beforeSave(); await share('דוח ביצוע עבודה'); }) }, svgIcon(ICONS.share, 19), many ? 'שיתוף 2 קובצי PDF (ארון + הפעלה)' : 'שיתוף PDF (עם תמונות)'),
    h('button', { cls: 'btn' + (okFirst ? '' : ' sec'), onclick: e => busy(e, async () => { if (beforeSave) await beforeSave(); await download(); }) }, svgIcon(ICONS.dl, 19), many ? 'הורדת PDF ארון + PDF הפעלה' : 'הורדת PDF למכשיר'),
    ...(canPick ? docs.map(d => h('button', { cls: 'btn sec', onclick: e => busy(e, async () => { const hnd = await pickHandle(d.fn, 'application/pdf', 'pdf'); if (beforeSave) await beforeSave(); const b = await d.p; if (hnd) { await writeHandle(hnd, b); toast('הקובץ נשמר'); } else dl(b, d.fn); }) }, svgIcon(ICONS.folder, 19), d.label ? 'שמירה בשם… ' + d.label : 'שמירה בשם… (בחירת נתיב)')) : [])
  ];
  return { docs, share, download, saveAs, btns };
}

const dl = (b, n) => {
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = n; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 30000);
};

const busy = async (e, fn) => {
  const b = e.currentTarget, orig = [...b.childNodes];
  b.textContent = 'מכין…'; b.disabled = true;
  try { await fn(); } catch (x) { if (!(x && x.name === 'AbortError')) toast('שגיאה: ' + ((x && x.message) || x)); }
  b.disabled = false; b.replaceChildren(...orig);
};

function goHome() {
  viewingWork = null;
  errs = [];
  i = -1;
  hd = 0;
  draw();
  scrollTo(0, 0);
}

function goBack() {
  if (viewingWork) {
    viewingWork = null;
    pendDelWork = false;
    draw();
    return;
  }
  if (hd > 0) history.back();
  else { errs = []; i = Math.max(-1, i - 1); draw(); }
}

addEventListener('popstate', () => {
  if (viewingWork) {
    viewingWork = null;
    pendDelWork = false;
    hd = Math.max(0, hd - 1);
    draw();
    return;
  }
  if (hd <= 0) return;
  hd--; errs = []; i = Math.max(-1, i - 1); draw();
});

const DB = () => new Promise((res, rej) => {
  if (!('indexedDB' in window)) { rej(new Error('IndexedDB אינו נתמך בדפדפן הזה')); return; }
  const q = indexedDB.open('rep', 1);
  q.onupgradeneeded = () => {
    if (!q.result.objectStoreNames.contains('k')) q.result.createObjectStore('k');
  };
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error || new Error('פתיחת מסד הנתונים נכשלה'));
  q.onblocked = () => rej(new Error('מסד הנתונים חסום על ידי לשונית אחרת'));
});

const idb = async (m, k, v) => {
  const d = await DB();
  try {
    return await new Promise((res, rej) => {
      let result;
      let settled = false;
      const t = d.transaction('k', m === 'get' ? 'readonly' : 'readwrite');
      const st = t.objectStore('k');
      const q = m === 'get' ? st.get(k) : m === 'put' ? st.put(v, k) : st.delete(k);
      q.onsuccess = () => { result = q.result; };
      q.onerror = () => { if (!settled) { settled = true; rej(q.error || new Error('פעולת מסד הנתונים נכשלה')); } };
      t.oncomplete = () => { if (!settled) { settled = true; res(result); } };
      t.onerror = () => { if (!settled) { settled = true; rej(t.error || new Error('שמירה למסד הנתונים נכשלה')); } };
      t.onabort = () => { if (!settled) { settled = true; rej(t.error || new Error('פעולת מסד הנתונים בוטלה')); } };
    });
  } finally {
    d.close();
  }
};

let dt, lf = 0;
var lastDraftAt = 0;
function paintAuto() {
  try {
    var el = document.getElementById('autoSavedChip');
    if (!el) { el = document.createElement('div'); el.id = 'autoSavedChip'; el.setAttribute('aria-live', 'polite'); document.body.appendChild(el); }
    var on = lastDraftAt && i >= 0 && !saved && !viewingWork;
    el.style.display = on ? '' : 'none';
    if (on) {
      var d = new Date(lastDraftAt), z = function (n) { return (n < 10 ? '0' : '') + n; };
      el.textContent = '✓ נשמר אוטומטית ב-' + z(d.getHours()) + ':' + z(d.getMinutes());
    }
  } catch (e) {}
}
setInterval(paintAuto, 1500);
const flash = () => {
  if (Date.now() - lf < 8000) return;
  lf = Date.now();
  toast('הטיוטה נשמרה');
};

const wd = () => {
  if (i >= 0 && !saved && !viewingWork && Object.keys(S).length > 1) {
    draft = { S: JSON.parse(JSON.stringify(S)), i, t: Date.now() };
    idb('put', 'draft', draft).catch(e => console.warn('Draft IndexedDB save failed:', e));
    try { localStorage.setItem('draft', JSON.stringify(draft)); } catch (e) {}
    lastDraftAt = Date.now(); paintAuto();
    flash();
  }
};

const sd = () => { clearTimeout(dt); dt = setTimeout(wd, 350); };
addEventListener('pagehide', wd);
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(dt); wd(); } });

const draftCard = () => {
  const d = draft, q = d.S || {};
  const ttl = [q.project, q.city].filter(Boolean).join(' · ') || 'דיווח ללא שם';
  const when = d.t ? fdt(new Date(d.t)) : '';
  return h('div', { cls: 'draft' },
    h('div', { cls: 'draft-top' },
      h('div', { cls: 'draft-ic' }, svgIcon(ICONS.edit, 20)),
      h('div', { cls: 'draft-tx' },
        h('div', { cls: 'draft-k' }, 'טיוטה פעילה'),
        h('div', { cls: 'draft-t' }, ttl),
        h('div', { cls: 'sub-muted' }, 'שלב ' + (d.i + 1), when ? ' · ' : null, when ? ltrSpan(when) : null)
      )
    ),
    h('div', { cls: 'draft-act' },
      h('button', { type: 'button', cls: 'btn ok', onclick: resume }, 'המשך טיוטה'),
      h('button', { type: 'button', cls: 'btn ghost del', ...(pendDelDraft ? { style: 'background:var(--er);color:#fff' } : {}), onclick: delDraft }, pendDelDraft ? 'בטוח? מחק' : 'מחיקה')
    )
  );
};

function delDraft() {
  if (!pendDelDraft) {
    pendDelDraft = true;
    setTimeout(() => { if (pendDelDraft) { pendDelDraft = false; if (i < 0) draw(); } }, 4000);
    draw();
    return;
  }
  pendDelDraft = false;
  draft = null;
  idb('del', 'draft').catch(e => console.warn('Could not delete draft from IndexedDB:', e));
  try { localStorage.removeItem('draft'); } catch (e) {}
  draw();
}

function newRep() {
  Object.keys(S).forEach(k => delete S[k]);
  S.date = new Date().toLocaleDateString('sv-SE');
  const sessCn = (getSess() || {}).contractor;
  if (sessCn) S.contractor = sessCn;   // מילוי אוטומטי של שם הקבלן לפי המשתמש המחובר
  saved = null;
  editingId = null;
  viewingWork = null;
  hd = 0;
  i = 0;
  errs = [];
  draw();
  scrollTo(0, 0);
}

function resume() {
  Object.keys(S).forEach(k => delete S[k]);
  Object.assign(S, draft.S);
  i = draft.i;
  hd = 0;
  saved = null;
  editingId = null;
  viewingWork = null;
  errs = [];
  try { for (let q = 0; q < i; q++) { history.pushState(null, ''); hd++; } } catch (e) {}
  draw();
  scrollTo(0, 0);
}

draw();
Promise.all([idb('get', 'draft'), idb('get', 'saved_works')]).then(([d, works]) => {
  if (!(d && d.S)) {
    try { d = JSON.parse(localStorage.getItem('draft')); } catch (e) { d = null; }
  }
  if (d && d.S) draft = d;

  if (Array.isArray(works)) {
    savedWorks = works;
  } else {
    try {
      const lite = JSON.parse(localStorage.getItem('reports_lite') || '[]');
      if (Array.isArray(lite)) {
        savedWorks = lite;
        if (lite.length) toast('נטענה רשימת שחזור חלקית בלבד. גיבוי JSON מלא שומר גם תמונות ונתוני עריכה.');
      }
    } catch (e) {}
  }
  if (i < 0) draw();
  checkApprovals();
}).catch(err => {
  console.error('Database initialization failed:', err);
  try {
    const d = JSON.parse(localStorage.getItem('draft') || 'null');
    if (d && d.S) draft = d;
    const lite = JSON.parse(localStorage.getItem('reports_lite') || '[]');
    if (Array.isArray(lite)) savedWorks = lite;
  } catch (e) {}
  toast('האחסון המלא אינו זמין. רשימת השחזור המקומית, אם קיימת, חלקית בלבד.');
  if (i < 0) draw();
});
</script>
