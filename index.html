<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" id="app-theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<title>דיווח עבודות · פק״ע תייקום</title>
<meta name="apple-mobile-web-app-title" content="פק״ע תייקום">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<style>
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --card-glass: rgba(255, 255, 255, 0.80);
  --fill: rgba(118, 118, 128, 0.11);
  --fill-hover: rgba(118, 118, 128, 0.18);
  --tx: #000000;
  --tx2: #8E8E93;
  --tx3: #3C3C43;
  --ac: #007AFF;
  --ac2: #5AC8FA;
  --ac-soft: rgba(0, 122, 255, 0.12);
  --ok: #34C759;
  --ok-soft: rgba(52, 199, 89, 0.14);
  --warn: #FF9500;
  --warn-soft: rgba(255, 149, 0, 0.14);
  --er: #FF3B30;
  --er-soft: rgba(255, 59, 48, 0.12);
  --sep: rgba(60, 60, 67, 0.15);
  --ring: 0 0 0 0.5px var(--sep);
  --shadow: 0 6px 26px rgba(0, 0, 0, 0.045), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-btn: 0 6px 18px rgba(0, 122, 255, 0.28);
  --shadow-ok: 0 6px 18px rgba(52, 199, 89, 0.28);
  --glow-1: rgba(90, 200, 250, 0.26);
  --glow-2: rgba(255, 184, 120, 0.18);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --card: #1C1C1E;
    --card-glass: rgba(28, 28, 30, 0.80);
    --fill: rgba(118, 118, 128, 0.24);
    --fill-hover: rgba(118, 118, 128, 0.34);
    --tx: #FFFFFF;
    --tx2: #8E8E93;
    --tx3: #EBEBF5;
    --ac: #0A84FF;
    --ac2: #64D2FF;
    --ac-soft: rgba(10, 132, 255, 0.18);
    --ok: #30D158;
    --ok-soft: rgba(48, 209, 88, 0.18);
    --warn: #FF9F0A;
    --warn-soft: rgba(255, 159, 10, 0.18);
    --er: #FF453A;
    --er-soft: rgba(255, 69, 58, 0.18);
    --sep: rgba(84, 84, 88, 0.45);
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.42);
    --shadow-btn: 0 6px 18px rgba(10, 132, 255, 0.32);
    --shadow-ok: 0 6px 18px rgba(48, 209, 88, 0.32);
    --glow-1: rgba(10, 132, 255, 0.24);
    --glow-2: rgba(255, 140, 80, 0.08);
  }
}

:root[data-theme="dark"] {
  --bg: #000000;
  --card: #1C1C1E;
  --card-glass: rgba(28, 28, 30, 0.80);
  --fill: rgba(118, 118, 128, 0.24);
  --fill-hover: rgba(118, 118, 128, 0.34);
  --tx: #FFFFFF;
  --tx2: #8E8E93;
  --tx3: #EBEBF5;
  --ac: #0A84FF;
  --ac2: #64D2FF;
  --ac-soft: rgba(10, 132, 255, 0.18);
  --ok: #30D158;
  --ok-soft: rgba(48, 209, 88, 0.18);
  --warn: #FF9F0A;
  --warn-soft: rgba(255, 159, 10, 0.18);
  --er: #FF453A;
  --er-soft: rgba(255, 69, 58, 0.18);
  --sep: rgba(84, 84, 88, 0.45);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.42);
  --shadow-btn: 0 6px 18px rgba(10, 132, 255, 0.32);
  --shadow-ok: 0 6px 18px rgba(48, 209, 88, 0.32);
  --glow-1: rgba(10, 132, 255, 0.24);
  --glow-2: rgba(255, 140, 80, 0.08);
}

* {
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior-y: none;
  height: 100%;
  height: 100dvh;
}

body {
  margin: 0;
  min-height: 100%;
  min-height: 100dvh;
  background:
    radial-gradient(75% 320px at 15% -40px, var(--glow-1), transparent 70%) no-repeat,
    radial-gradient(65% 300px at 88% -20px, var(--glow-2), transparent 70%) no-repeat,
    var(--bg);
  color: var(--tx);
  font-family: "Rubik", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  font-size: 17px;
  line-height: 1.42;
  letter-spacing: -0.012em;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(36px + env(safe-area-inset-bottom, 0px));
}

button, input, textarea, select {
  font-family: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.nav-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--card-glass);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid var(--sep);
  padding-top: env(safe-area-inset-top, 0px);
}

.nav-inner {
  max-width: 560px;
  margin: 0 auto;
  height: 52px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.nav-back {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--ac);
  font-size: 16px;
  font-weight: 500;
  padding: 8px 4px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.nav-back:active { opacity: 0.45; }
.nav-back svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.4; fill: none; }

.nav-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-step {
  font-size: 13px;
  font-weight: 600;
  color: var(--ac);
  background: var(--ac-soft);
  padding: 4px 10px;
  border-radius: 99px;
  font-variant-numeric: tabular-nums;
}

.theme-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--fill);
  color: var(--tx);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s;
}
.theme-btn:active {
  transform: scale(0.92);
  background: var(--fill-hover);
}
.theme-btn.auto-active {
  color: var(--ac);
  box-shadow: inset 0 0 0 1.5px var(--ac);
}
.theme-controls {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: 0 0 auto;
}

.pb {
  height: 3px;
  background: var(--fill);
  width: 100%;
  overflow: hidden;
}
.pb i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--ac), var(--ac2));
  border-radius: 0 3px 3px 0;
  transition: width 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}

#app {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.home-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--tx2);
  background: var(--card);
  padding: 6px 12px;
  border-radius: 99px;
  box-shadow: var(--ring), var(--shadow);
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 3px var(--ok-soft);
}

.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 20px 8px 20px;
}

.app-icon {
  width: 86px;
  height: 86px;
  border-radius: 26px;
  background: linear-gradient(150deg, #64D2FF 0%, #0A84FF 48%, #0040DD 100%);
  box-shadow: 0 18px 38px rgba(0, 100, 255, 0.30), inset 0 1.5px 1px rgba(255, 255, 255, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  color: #fff;
}
.app-icon svg {
  width: 42px;
  height: 42px;
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.22));
}

.hero h1 {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 6px;
}

.hero .sub {
  font-size: 16px;
  color: var(--tx2);
  max-width: 320px;
  margin: 0 0 24px;
}

.hero-actions {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.install-banner {
  background: var(--ac-soft);
  border: 1px solid rgba(0, 122, 255, 0.2);
  border-radius: 20px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  text-align: right;
  box-shadow: var(--shadow);
  transition: transform 0.14s;
}
.install-banner:active { transform: scale(0.98); }
.install-banner .ib-txt { min-width: 0; }
.install-banner .ib-title { font-weight: 700; font-size: 15px; color: var(--ac); margin-bottom: 2px; }
.install-banner .ib-sub { font-size: 13px; color: var(--tx2); }

.step-header {
  padding: 6px 4px 14px;
}
.step-header h2 {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 0;
}
.step-header .step-sub {
  font-size: 14px;
  color: var(--tx2);
  margin-top: 4px;
}

.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 24px 4px 12px;
}
.sec-head h3 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.count-pill {
  font-size: 13px;
  font-weight: 700;
  background: var(--ac-soft);
  color: var(--ac);
  padding: 2px 10px;
  border-radius: 99px;
  font-variant-numeric: tabular-nums;
}

.card {
  background: var(--card);
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--ring), var(--shadow);
}

.field-group {
  margin-bottom: 20px;
}
.field-group:last-child {
  margin-bottom: 2px;
}

.lb {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 600;
  font-size: 13px;
  color: var(--tx2);
  margin: 0 0 8px 2px;
}
.lb .req {
  color: var(--ac);
  margin-right: 4px;
  font-weight: 700;
}
.lb .done-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ok);
  background: var(--ok-soft);
  padding: 2px 9px;
  border-radius: 99px;
}

input, textarea {
  width: 100%;
  font-size: 17px;
  color: var(--tx);
  background: var(--fill);
  border: 1.5px solid transparent;
  border-radius: 14px;
  padding: 13px 16px;
  transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
  outline: none;
}
input:focus, textarea:focus {
  background: var(--card);
  border-color: var(--ac);
  box-shadow: 0 0 0 3.5px var(--ac-soft);
}
textarea {
  min-height: 96px;
  resize: vertical;
}
input[type=date] {
  display: block;
  -webkit-appearance: none;
  appearance: none;
  min-width: 0;
  max-width: 100%;
  min-height: 50px;
  text-align: right;
}
input::-webkit-date-and-time-value {
  text-align: right;
}

.search-box {
  position: relative;
  margin-bottom: 10px;
}
.search-box svg {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--tx2);
  pointer-events: none;
}
.search-box input {
  padding-right: 42px;
  background: var(--card);
  box-shadow: var(--ring), var(--shadow);
  border-radius: 15px;
  font-size: 16px;
}

.filter-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 12px;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }

.pill-btn {
  flex: 0 0 auto;
  border: none;
  border-radius: 99px;
  padding: 7px 14px;
  font-size: 14px;
  font-weight: 600;
  background: var(--card);
  color: var(--tx3);
  box-shadow: var(--ring);
  cursor: pointer;
  transition: all 0.15s;
}
.pill-btn.on {
  background: var(--ac);
  color: #FFFFFF;
  box-shadow: 0 4px 12px var(--ac-soft);
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.015em;
  border: 0;
  border-radius: 16px;
  padding: 15px 18px;
  cursor: pointer;
  width: 100%;
  min-height: 54px;
  background: var(--ac);
  color: #FFFFFF;
  box-shadow: var(--shadow-btn), inset 0 1px 0 rgba(255, 255, 255, 0.24);
  transition: transform 0.13s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.15s, background 0.15s;
}
.btn:active {
  transform: scale(0.975);
  opacity: 0.9;
}
.btn:disabled {
  opacity: 0.55;
  transform: none;
}
.btn.ok {
  background: var(--ok);
  box-shadow: var(--shadow-ok), inset 0 1px 0 rgba(255, 255, 255, 0.24);
}
.btn.sec {
  background: var(--card);
  color: var(--ac);
  box-shadow: var(--ring), var(--shadow);
  font-weight: 600;
}
.btn.ghost {
  background: var(--fill);
  color: var(--ac);
  box-shadow: none;
  font-weight: 600;
}
.btn.danger {
  background: var(--er-soft);
  color: var(--er);
  box-shadow: none;
}

.actions-stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 8px;
}

.ch {
  display: flex;
  flex-direction: column;
  background: var(--fill);
  border-radius: 16px;
  overflow: hidden;
}
.ch .bt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 16px;
  font-weight: 500;
  background: transparent;
  color: var(--tx);
  border: 0;
  border-bottom: 0.5px solid var(--sep);
  border-radius: 0;
  padding: 14px 16px;
  min-height: 52px;
  cursor: pointer;
  text-align: right;
  transition: background 0.15s;
}
.ch .bt:last-child { border-bottom: 0; }
.ch .bt:active { background: var(--fill-hover); }
.ch .bt.on {
  background: transparent;
  color: var(--tx);
  font-weight: 600;
}
.ch .bt.on > span:first-child { color: var(--ac); }
.ch .bt .chk {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--ac);
}
.ch .bt.multi .chk {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--tx2);
}
.ch .bt.multi.on .chk {
  background: var(--ac);
  border-color: var(--ac);
  color: #fff;
}

.cn {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}
.cn .bt {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 13px;
  background: var(--fill);
  color: var(--tx);
  min-height: 46px;
  font-size: 16px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: all 0.15s;
}
.cn .bt:active { transform: scale(0.95); }
.cn .bt.on {
  background: var(--ac);
  color: #fff;
  box-shadow: 0 4px 12px var(--ac-soft);
}

.rw {
  background: var(--bg);
  border-radius: 18px;
  padding: 15px 16px;
  margin-bottom: 10px;
  box-shadow: var(--ring);
}
.rw:last-child { margin-bottom: 0; }
.rw > .t {
  color: var(--ac);
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 10px;
}

.th {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}
.tm {
  position: relative;
  width: 84px;
  height: 84px;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
  cursor: pointer;
}
.tm img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 14px;
}
.dl {
  position: absolute;
  top: -7px;
  left: -7px;
  width: 26px;
  height: 26px;
  border-radius: 13px;
  border: 2px solid var(--card);
  background: var(--er);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
}

.r2 {
  display: flex;
  gap: 10px;
}
.r2 .btn {
  margin: 0;
  padding: 12px;
  min-height: 46px;
  font-size: 15px;
}

.err {
  background: var(--er-soft);
  border: 1px solid rgba(255, 59, 48, 0.25);
  color: var(--er);
  border-radius: 18px;
  padding: 14px 16px;
  margin-bottom: 14px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.55;
}

.ln {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 0.5px solid var(--sep);
  font-size: 15px;
}
.ln:last-child { border-bottom: none; padding-bottom: 2px; }
.ln:first-child { padding-top: 2px; }
.ln span:first-child { color: var(--tx2); flex-shrink: 0; }
.ln span:last-child { font-weight: 600; text-align: left; word-break: break-word; }

.saved-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--ok-soft);
  border-radius: 18px;
  padding: 14px 16px;
  margin-bottom: 16px;
}
.saved-icon {
  width: 36px;
  height: 36px;
  border-radius: 18px;
  background: var(--ok);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.sub-muted {
  color: var(--tx2);
  font-size: 13px;
}

.draft {
  background: var(--card);
  border-radius: 22px;
  padding: 16px;
  box-shadow: var(--ring), var(--shadow);
  text-align: right;
}
.draft-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.draft-ic {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: var(--warn-soft);
  color: var(--warn);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.draft-tx { min-width: 0; flex: 1; }
.draft-k { font-size: 12px; font-weight: 700; color: var(--warn); }
.draft-t { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.draft-act { display: flex; gap: 10px; }
.draft-act .btn { min-height: 46px; font-size: 15px; border-radius: 14px; }
.draft-act .del { width: auto; flex: 0 0 auto; padding: 12px 18px; color: var(--er); }

.work-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.work-card {
  background: var(--card);
  border-radius: 22px;
  padding: 16px 18px;
  box-shadow: var(--ring), var(--shadow);
  cursor: pointer;
  transition: transform 0.14s ease, background 0.15s ease;
}
.work-card:active {
  transform: scale(0.985);
}

.wc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.co-tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;

function need(fs, o, out, pre = '') {
  for (const x of fs) {
    if (!vis(x, o) || x.opt) continue;
    const v = o[x.k], L = pre + lab(x, o);
    if (x.t === 'rows') {
      const n = S[x.n] || 0;
      for (let j = 0; j < n; j++) need(x.cols, (v || [])[j] || {}, out, x.l + ' ' + (j + 1) + ': ');
    }
    else if (x.t === 'photo') { if (!(v && v.length)) out.push('חסרה תמונה בקטגוריה: ' + L); }
    else if (x.t === 'multi') { if (!(v && v.length)) out.push('יש לבחור לפחות פעולה אחת'); }
    else if (x.t === 'count') { if (v === undefined || v === null || v === '') out.push('יש לבחור ' + L); }
    else if (!v || !String(v).trim()) out.push(x.t === 'choice' ? 'יש לבחור: ' + L : x.t === 'num' ? 'נא להזין מספר: ' + L : 'נא למלא: ' + L);
  }
}

function shrink(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1000 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = im.width * k;
      c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    im.onerror = () => toast('לא ניתן לטעון את התמונה');
    im.src = r.result;
  };
  r.readAsDataURL(file);
}

const isEmptyFld = (x, o) => {
  const v = o[x.k];
  if (x.t === 'rows') return false;
  if (x.t === 'photo' || x.t === 'multi') return !(v && v.length);
  if (x.t === 'count') return v === undefined || v === null || v === '';
  return !v || !String(v).trim();
};

function stepProg(s) {
  let t = 0, d = 0;
  (function w(fs, o) {
    for (const x of fs) {
      if (!vis(x, o) || x.opt) continue;
      const v = o[x.k];
      if (x.t === 'rows') {
        const n = S[x.n] || 0;
        for (let j = 0; j < n; j++) w(x.cols, (v || [])[j] || {});
      } else {
        t++;
        if (x.t === 'photo' || x.t === 'multi') { if (v && v.length) d++; }
        else if (x.t === 'count') { if (v !== undefined && v !== null && v !== '') d++; }
        else if (v && String(v).trim()) d++;
      }
    }
  })(s.fields, S);
  return { t, d };
}

function progCard(s) {
  try {
    const { t, d } = stepProg(s);
    if (!t) return null;
    const p = Math.round(d / t * 100);
    return h('div', { cls: 'step-progress' + (p === 100 ? ' full' : ''), id: 'sp' },
      h('div', { cls: 'sp-row' },
        h('span', { cls: 'sp-a' }, 'מולאו ' + d + ' מתוך ' + t + ' שדות חובה'),
        h('b', { cls: 'sp-p' }, p + '%')
      ),
      h('div', { cls: 'sp-bar' }, h('i', { style: 'width:' + p + '%' }))
    );
  } catch (e) { return null; }
}

function updSP() {
  try {
    const box = document.getElementById('sp');
    if (!box) return;
    const s = steps()[i];
    if (!s) return;
    const { t, d } = stepProg(s);
    if (!t) return;
    const p = Math.round(d / t * 100);
    box.classList.toggle('full', p === 100);
    box.querySelector('.sp-a').textContent = 'מולאו ' + d + ' מתוך ' + t + ' שדות חובה';
    box.querySelector('.sp-p').textContent = p + '%';
    box.querySelector('.sp-bar i').style.width = p + '%';
  } catch (e) {}
}

      });
      return h('div', { style: 'flex:1' }, inp,

  } else {

      });
      ip.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter' || ev.isComposing) return;
        ev.preventDefault();
        try {
          const a = fields(), nx = a[a.indexOf(ip) + 1];

          else ip.blur();

function lines(stateObj = S) {
  const out = [], ph = [];
  const origS = { ...S };
  if (stateObj !== S) {
    Object.keys(S).forEach(k => delete S[k]);
    Object.assign(S, stateObj);
  }
  const activeSteps = steps();
  if (stateObj !== S) {
    Object.keys(S).forEach(k => delete S[k]);
    Object.assign(S, origS);
  }

  (function w(fs, o) {
    for (const x of fs) {
      if (!vis(x, o) || x.t === 'count') continue;
      const v = o[x.k];
      if (x.t === 'rows') (v || []).slice(0, stateObj[x.n] || 0).forEach((r, j) => out.push([x.l + ' ' + (j + 1), x.cols.filter(c => vis(c, r) && r[c.k]).map(c => lab(c, r) + ': ' + r[c.k]).join(' · ')]));
      else if (x.t === 'photo') { if (v && v.length) { out.push([lab(x, o), v.length + ' תמונות']); ph.push([lab(x, o), v]); } }
      else if (x.t === 'multi') { if (v && v.length) out.push([lab(x, o), v.join(', ')]); }
      else if (v) out.push([lab(x, o), v]);
    }
  })(activeSteps.flatMap(s => s.fields), stateObj);
  return { out, ph };
}

async function saveWorkRecord(out, ph) {
  const nowStr = new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });
  const id = editingId || (saved && saved.id) || ('R-' + Date.now().toString(36).toUpperCase());
  const existingIdx = savedWorks.findIndex(w => w.id === id);
  const createdAt = existingIdx >= 0 ? savedWorks[existingIdx].createdAt : nowStr;
  const photoCount = ph.reduce((sum, [, arr]) => sum + arr.length, 0);
  const record = {
    id, createdAt, updatedAt: nowStr, ts: Date.now(),
    data: JSON.parse(JSON.stringify(S)), lines: out, photoCount,
    meta: {
      contractor: S.contractor || '', date: S.date || '',
      project: S.project || 'עבודה ללא שם', city: S.city || '',
      address: S.address || '', co: S.co || '', wk: S.wk || '',
      sub: S.ks || S.sub || '', tk: S.tk || ''
    }
  };

  const nextWorks = savedWorks.slice();
  if (existingIdx >= 0) nextWorks[existingIdx] = record;
  else nextWorks.unshift(record);

  try {
    // Do not update the visible saved state until the IndexedDB transaction succeeds.
    await idb('put', 'saved_works', nextWorks);
  } catch (e) {
    console.error('IndexedDB save failed:', e);
    toast('השמירה נכשלה. הדיווח נשאר פתוח — אין לסגור את הדף עד שתנסה שוב.');
    return false;
  }

  savedWorks = nextWorks;
  saved = { id, at: nowStr };
  editingId = id;

  // This is only a lightweight index for recovery/list display, not a full backup.
  try {
    const lite = savedWorks.map(({ id, createdAt, updatedAt, ts, lines, photoCount, meta }) => ({
      id, createdAt, updatedAt, ts, lines, photoCount, meta
    }));
    localStorage.setItem('reports_lite', JSON.stringify(lite));
  } catch (e) {}

  try { await idb('del', 'draft'); } catch (e) { console.warn('Could not clear saved draft:', e); }
  try { localStorage.removeItem('draft'); } catch (e) {}
  draft = null;

  toast('העבודה נשמרה ברשימת העבודות השמורות');
  draw();
  return true;
}

function summary() {
  const { out, ph } = lines(S);
  const stepOf = new Map();
  try {
    steps().forEach((st, idx) => (function w(fs) {
      for (const x of fs) {
        if (x.t === 'rows') { const n = S[x.n] || 0; for (let j = 0; j < n; j++) { const k = x.l + ' ' + (j + 1); if (!stepOf.has(k)) stepOf.set(k, idx); } }
        else { const k = lab(x, S); if (!stepOf.has(k)) stepOf.set(k, idx); }
      }
    })(st.fields));
  } catch (e) {}
  const jump = k => {
    errs = [];
    i = k;
    try { history.pushState(null, ''); hd++; } catch (e) {}
    draw();
    scrollTo(0, 0);
  };
  const body = () => [
    h('div', { cls: 'card' }, out.map(([a, b]) => {
      const k = stepOf.get(a);
      return h('div', { cls: 'ln' + (k !== undefined ? ' tap' : ''), ...(k !== undefined ? { onclick: () => jump(k) } : {}) }, h('span', {}, a), h('span', {}, String(b)));
    })),
    ...ph.map(([t, a]) => h('div', { cls: 'card' },
      h('div', { cls: 'lb' }, t),
      h('div', { cls: 'th', style: 'margin-bottom:0' }, a.map(d =>
        h('div', { cls: 'tm', onclick: () => { lightboxData = { src: d, cap: t }; draw(); } }, h('img', { src: d }))
      ))
    ))
  ];

  const txt = () => 'דוח ביצוע עבודה' + (saved ? ' ' + saved.id : '') + '\n' + out.map(([a, b]) => a + ': ' + b).join('\n');

  const share = async () => {
    await saveWorkRecord(out, ph);
    try { await navigator.share({ title: 'דוח ביצוע עבודה', text: txt() }); }
    catch (e) { if (e && e.name === 'AbortError') return; window.open('https://wa.me/?text=' + encodeURIComponent(txt()), '_blank'); }
  };

  const pp = getPdf(out, ph), pn = 'report-' + (S.date || '') + '.pdf';

  const sharePdf = async () => {
    await saveWorkRecord(out, ph);
    const b = await pp, fl = new File([b], pn, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [fl] })) {
      try { await navigator.share({ files: [fl], title: 'דוח ביצוע עבודה' }); }
      catch (e) {
        if (e && e.name === 'AbortError') return;
        if (e && e.name === 'NotAllowedError') { toast('ה-PDF מוכן, לחצו שוב על שיתוף'); return; }
        throw e;
      }
    } else dl(b, pn);
  };

  const savePdf = async () => {
    await saveWorkRecord(out, ph);
    dl(await pp, pn);
  };

  return [

function backupRow() {
  const persist = async () => {
    await idb('put', 'saved_works', savedWorks);
    try {
      const lite = savedWorks.map(({ id, createdAt, updatedAt, ts, lines, photoCount, meta }) => ({ id, createdAt, updatedAt, ts, lines, photoCount, meta }));
      localStorage.setItem('reports_lite', JSON.stringify(lite));
    } catch (e) {}
  };

  const exp = async () => {
    if (!savedWorks.length) { toast('אין עבודות שמורות לגיבוי'); return; }
    const blob = new Blob([JSON.stringify({ app: 'work-report', v: 1, exportedAt: new Date().toISOString(), works: savedWorks })], { type: 'application/json' });
    const name = 'backup-' + new Date().toLocaleDateString('sv-SE') + '.json';
    try {
      const fl = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [fl] })) {
        try { await navigator.share({ files: [fl], title: 'גיבוי עבודות' }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
      }
    } catch (e) {}
    dl(blob, name);
  };

  const inp = h('input', {
    type: 'file', accept: '.json,application/json', style: 'display:none',
    onchange: e => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      const r = new FileReader();
      r.onload = async () => {
        try {
          const j = JSON.parse(r.result);
          const arr = Array.isArray(j) ? j : j && j.works;
          if (!Array.isArray(arr)) throw new Error('bad');
          let add = 0, upd = 0;
          for (const w of arr) {
            if (!w || typeof w !== 'object' || typeof w.id !== 'string') continue;
            const k = savedWorks.findIndex(x => x.id === w.id);
            if (k < 0) { savedWorks.push(w); add++; }
            else if ((w.ts || 0) > (savedWorks[k].ts || 0)) { savedWorks[k] = w; upd++; }
          }
          if (!add && !upd) { toast('אין עבודות חדשות בקובץ'); return; }
          savedWorks.sort((a, b) => (b.ts || 0) - (a.ts || 0));
          await persist();
          toast('שוחזרו ' + (add + upd) + ' עבודות');
          draw();
        } catch (err) { toast('קובץ גיבוי לא תקין'); }
      };
      r.onerror = () => toast('לא ניתן לקרוא את הקובץ');
      r.readAsText(f);
    }
  });

  return h('div', { cls: 'backup-row' },
    h('div', { cls: 'sub-muted', style: 'margin-bottom:8px' }, 'העבודות נשמרות על המכשיר בלבד. מומלץ לגבות מדי פעם.'),
    h('div', { cls: 'r2' },
      h('div', { style: 'flex:1' }, h('button', { type: 'button', cls: 'btn ghost', onclick: e => busy(e, exp) }, svgIcon(ICONS.dl, 18), 'גיבוי עבודות')),
      h('div', { style: 'flex:1' }, inp, h('button', { type: 'button', cls: 'btn ghost', onclick: () => inp.click() }, svgIcon(ICONS.folder, 18), 'שחזור מגיבוי'))
    )
  );
}

function savedWorkDetail(w) {
  const { out, ph } = w.data ? lines(w.data) : { out: w.lines || [], ph: [] };
  const txt = () => 'דוח ביצוע עבודה ' + w.id + '\n' + out.map(([a, b]) => a + ': ' + b).join('\n');
  const pp = getPdf(out, ph), pn = 'report-' + ((w.meta && w.meta.date) || w.id) + '.pdf';

  const sharePdf = async () => {
    const b = await pp, fl = new File([b], pn, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [fl] })) {
      try { await navigator.share({ files: [fl], title: 'דוח ביצוע עבודה ' + w.id }); }
      catch (e) {
        if (e && e.name === 'AbortError') return;
        if (e && e.name === 'NotAllowedError') { toast('ה-PDF מוכן, לחצו שוב על שיתוף'); return; }
        throw e;
      }
    } else dl(b, pn);
  };

  const savePdf = async () => dl(await pp, pn);

  const editWork = () => {
    if (!w.data) { toast('לא ניתן לערוך רשומה ישנה ללא נתוני מקור'); return; }
    Object.keys(S).forEach(k => delete S[k]);
    Object.assign(S, JSON.parse(JSON.stringify(w.data)));
    editingId = w.id;
    saved = { id: w.id, at: w.updatedAt || w.createdAt };
    viewingWork = null;
    i = 0;
    errs = [];
    draw();
    scrollTo(0, 0);
  };

  const duplicateWork = () => {
    if (!w.data) { toast('לא ניתן לשכפל רשומה זו'); return; }
    const copy = JSON.parse(JSON.stringify(w.data));
    Object.keys(copy).forEach(k => { if (k.startsWith('ph:')) delete copy[k]; });
    copy.date = new Date().toLocaleDateString('sv-SE');
    Object.keys(S).forEach(k => delete S[k]);
    Object.assign(S, copy);
    editingId = null;
    saved = null;
    viewingWork = null;
    i = 0;
    errs = [];
    toast('העבודה שוכפלה · הזן נתונים מעודכנים');
    draw();
    scrollTo(0, 0);
  };

  const deleteWork = async () => {
    if (!pendDelWork) {
      pendDelWork = true;
      setTimeout(() => { if (pendDelWork) { pendDelWork = false; if (viewingWork) draw(); } }, 4000);
      draw();
      return;
    }
    pendDelWork = false;
    const nextWorks = savedWorks.filter(item => item.id !== w.id);
    try {
      await idb('put', 'saved_works', nextWorks);
    } catch (e) {
      console.error('IndexedDB delete failed:', e);
      toast('המחיקה נכשלה. העבודה לא נמחקה.');
      draw();
      return;
    }
    savedWorks = nextWorks;
    try {
      const lite = savedWorks.map(({ id, createdAt, updatedAt, ts, lines, photoCount, meta }) => ({
        id, createdAt, updatedAt, ts, lines, photoCount, meta
      }));
      localStorage.setItem('reports_lite', JSON.stringify(lite));
    } catch (e) {}
    viewingWork = null;
    toast('העבודה נמחקה');
    draw();
  };

  return [
    h('div', { cls: 'step-header' },
      h('h2', {}, (w.meta && w.meta.project) || 'פרטי עבודה שמורה'),
      h('div', { cls: 'step-sub' }, 'מזהה ' + w.id + ' · נשמר ב-' + (w.updatedAt || w.createdAt))
    ),
    h('div', { cls: 'card' }, out.map(([a, b]) => h('div', { cls: 'ln' }, h('span', {}, a), h('span', {}, String(b))))),
    ...ph.map(([t, a]) => h('div', { cls: 'card' },
      h('div', { cls: 'lb' }, t),
      h('div', { cls: 'th', style: 'margin-bottom:0' }, a.map(d =>
        h('div', { cls: 'tm', onclick: () => { lightboxData = { src: d, cap: t }; draw(); } }, h('img', { src: d }))
      ))
    )),
    h('div', { cls: 'actions-stack' },
      h('button', { cls: 'btn ok', onclick: e => busy(e, sharePdf) }, svgIcon(ICONS.share, 19), 'שיתוף PDF (עם תמונות)'),
      h('button', { cls: 'btn', onclick: e => busy(e, savePdf) }, svgIcon(ICONS.dl, 19), 'הורדת PDF למכשיר'),
      w.data ? h('button', { cls: 'btn sec', onclick: editWork }, svgIcon(ICONS.edit, 18), 'עריכת עבודה') : null,
      w.data ? h('button', { cls: 'btn ghost', onclick: duplicateWork }, svgIcon(ICONS.copy, 18), 'שכפול כעבודה חדשה') : null,
      h('button', { cls: 'btn danger', onclick: deleteWork }, svgIcon(ICONS.trash, 18), pendDelWork ? 'לחץ שוב לאישור מחיקה' : 'מחיקת עבודה')
    )
  ];
}

        h('div', { cls: 'hero-actions' },
          h('div', {

              } else {

              }
            }
          },

  const activeSearch = preserveFocus && document.activeElement && document.activeElement.type === 'search';
  const selStart = activeSearch ? document.activeElement.selectionStart : null;

  $('#app').replaceChildren(...el.filter(Boolean));

  if (activeSearch) {
    const inp = $('#app input[type="search"]');
    if (inp) {
      inp.focus();
      if (selStart !== null) inp.setSelectionRange(selStart, selStart);
    }
  } else if (errs.length && i >= 0 && i < st.length) {
    scrollTo(0, 0);
  } else {
    scrollTo(0, y);
  }
}

const ld = d => new Promise((res, rej) => { const m = new Image(); m.onload = () => res(m); m.onerror = rej; m.src = d; });
const jpg = c => {
  const b = atob(c.toDataURL('image/jpeg', 0.82).split(',')[1]), u = new Uint8Array(b.length);
  for (let q = 0; q < b.length; q++) u[q] = b.charCodeAt(q);
  return u;
};

async function mkPDF(out, ph) {
  const W = 1190, H = 1684, M = 70, pages = [];
  let c, x, y;
  const np = () => {
    c = document.createElement('canvas'); c.width = W; c.height = H;
    x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#000'; x.direction = 'rtl'; x.textAlign = 'right'; y = M; pages.push(c);
  };
  const wrap = (t, w) => {
    const ls = []; let l = '';
    for (const s of String(t).split(' ')) {
      const n = l ? l + ' ' + s : s;
      if (x.measureText(n).width > w && l) { ls.push(l); l = s; } else l = n;
    }
    ls.push(l); return ls;
  };
  np();
  x.font = 'bold 44px Arial'; x.fillText('דוח ביצוע עבודה', W - M, y + 44); y += 72;
  x.font = '24px Arial'; x.fillStyle = '#666'; x.fillText('הופק: ' + new Date().toLocaleString('he-IL'), W - M, y); y += 46;
  for (const [a, b] of out) {
    x.font = '26px Arial';
    const la = wrap(a, 380), lb = wrap(b, W - 2 * M - 420), rh = Math.max(la.length, lb.length) * 36 + 16;
    if (y + rh > H - M) { np(); x.font = '26px Arial'; }
    x.fillStyle = '#666'; la.forEach((t, k) => x.fillText(t, W - M, y + 30 + k * 36));
    x.fillStyle = '#000'; lb.forEach((t, k) => x.fillText(t, W - M - 400, y + 30 + k * 36));
    y += rh; x.strokeStyle = '#ddd'; x.lineWidth = 1; x.beginPath(); x.moveTo(M, y - 6); x.lineTo(W - M, y - 6); x.stroke();
  }
  for (const [t, arr] of ph) {
    for (let j = 0; j < arr.length; j++) {
      np(); x.textAlign = 'right';
      const PM = 18, cap = t + (arr.length > 1 ? ' (' + (j + 1) + '/' + arr.length + ')' : '');
      let ix = W - PM, iy = PM;
      try {
        const m = await ld(arr[j]), maxW = W - 2 * PM, maxH = H - 2 * PM, k = Math.min(maxW / m.width, maxH / m.height), w = m.width * k, h2 = m.height * k;
        const px = PM + (maxW - w) / 2, py = PM + (maxH - h2) / 2;
        x.drawImage(m, px, py, w, h2);
        ix = px + w; iy = py;
      } catch (e) { x.fillStyle = '#000'; x.font = '24px Arial'; x.fillText('לא ניתן לטעון את התמונה', W - PM, PM + 100); }
      x.font = 'bold 28px Arial';
      const cw = x.measureText(cap).width + 28;
      x.fillStyle = 'rgba(0,0,0,0.62)'; x.fillRect(ix - cw - 10, iy + 10, cw, 46);
      x.fillStyle = '#fff'; x.fillText(cap, ix - 24, iy + 43);
    }
  }
  const N = pages.length, enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const add = b => { const u = typeof b === 'string' ? enc.encode(b) : b; parts.push(u); len += u.length; };
  const obj = (n, fn) => { offs[n] = len; add(n + ' 0 obj\n'); fn(); add('\nendobj\n'); };
  add('%PDF-1.4\n');
  obj(1, () => add('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2, () => add('<</Type/Pages/Count ' + N + '/Kids[' + pages.map((_, k) => (5 + 3 * k) + ' 0 R').join(' ') + ']>>'));
  pages.forEach((p, k) => {
    const j = jpg(p), cs = 'q 595 0 0 842 0 0 cm /I Do Q';
    obj(3 + 3 * k, () => { add('<</Type/XObject/Subtype/Image/Width ' + W + '/Height ' + H + '/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ' + j.length + '>>\nstream\n'); add(j); add('\nendstream'); });
    obj(4 + 3 * k, () => add('<</Length ' + cs.length + '>>\nstream\n' + cs + '\nendstream'));
    obj(5 + 3 * k, () => add('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</I ' + (3 + 3 * k) + ' 0 R>>>>/Contents ' + (4 + 3 * k) + ' 0 R>>'));
  });
  const xr = len, tot = 3 + 3 * N;
  add('xref\n0 ' + tot + '\n0000000000 65535 f \n');
  for (let n = 1; n < tot; n++) add(String(offs[n]).padStart(10, '0') + ' 00000 n \n');
  add('trailer\n<</Size ' + tot + '/Root 1 0 R>>\nstartxref\n' + xr + '\n%%EOF');
  return new Blob(parts, { type: 'application/pdf' });
}

let pc = { k: '', p: null };
const getPdf = (out, ph) => {
  // Include the actual image data so replacing a photo with another of equal size
  // cannot accidentally reuse a stale PDF.
  const k = JSON.stringify([out, ph]);
  if (pc.k !== k) { pc.k = k; pc.p = mkPDF(out, ph); pc.p.catch(() => {}); }
  return pc.p;
};

const dl = (b, n) => {
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = n; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 30000);
};

const busy = async (e, fn) => {
  const b = e.currentTarget, orig = [...b.childNodes];
  b.textContent = 'מכין…'; b.disabled = true;
  try { await fn(); } catch (x) { if (!(x && x.name === 'AbortError')) toast('שגיאה: ' + ((x && x.message) || x)); }
  b.disabled = false; b.replaceChildren(...orig);
};

function goHome() {
  viewingWork = null;
  errs = [];
  i = -1;
  hd = 0;
  draw();
  scrollTo(0, 0);
}

function goBack() {
  if (viewingWork) {
    viewingWork = null;
    pendDelWork = false;
    draw();
    return;
  }
  if (hd > 0) history.back();
  else { errs = []; i = Math.max(-1, i - 1); draw(); }
}

addEventListener('popstate', () => {
  if (viewingWork) {
    viewingWork = null;
    pendDelWork = false;
    hd = Math.max(0, hd - 1);
    draw();
    return;
  }
  if (hd <= 0) return;
  hd--; errs = []; i = Math.max(-1, i - 1); draw();
});

const DB = () => new Promise((res, rej) => {
  if (!('indexedDB' in window)) { rej(new Error('IndexedDB אינו נתמך בדפדפן הזה')); return; }
  const q = indexedDB.open('rep', 1);
  q.onupgradeneeded = () => {
    if (!q.result.objectStoreNames.contains('k')) q.result.createObjectStore('k');
  };
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error || new Error('פתיחת מסד הנתונים נכשלה'));
  q.onblocked = () => rej(new Error('מסד הנתונים חסום על ידי לשונית אחרת'));
});

const idb = async (m, k, v) => {
  const d = await DB();
  try {
    return await new Promise((res, rej) => {
      let result;
      let settled = false;
      const t = d.transaction('k', m === 'get' ? 'readonly' : 'readwrite');
      const st = t.objectStore('k');
      const q = m === 'get' ? st.get(k) : m === 'put' ? st.put(v, k) : st.delete(k);
      q.onsuccess = () => { result = q.result; };
      q.onerror = () => { if (!settled) { settled = true; rej(q.error || new Error('פעולת מסד הנתונים נכשלה')); } };
      t.oncomplete = () => { if (!settled) { settled = true; res(result); } };
      t.onerror = () => { if (!settled) { settled = true; rej(t.error || new Error('שמירה למסד הנתונים נכשלה')); } };
      t.onabort = () => { if (!settled) { settled = true; rej(t.error || new Error('פעולת מסד הנתונים בוטלה')); } };
    });
  } finally {
    d.close();
  }
};

let dt, lf = 0;
const flash = () => {
  if (Date.now() - lf < 8000) return;
  lf = Date.now();
  toast('הטיוטה נשמרה');
};

const wd = () => {
  if (i >= 0 && !saved && !viewingWork && Object.keys(S).length > 1) {
    draft = { S: JSON.parse(JSON.stringify(S)), i, t: Date.now() };
    idb('put', 'draft', draft).catch(e => console.warn('Draft IndexedDB save failed:', e));
    try { localStorage.setItem('draft', JSON.stringify(draft)); } catch (e) {}
    flash();
  }
};

const sd = () => { clearTimeout(dt); dt = setTimeout(wd, 350); };
addEventListener('pagehide', wd);
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(dt); wd(); } });

const draftCard = () => {
  const d = draft, q = d.S || {};
  const ttl = [q.project, q.city].filter(Boolean).join(' · ') || 'דיווח ללא שם';
  const when = d.t ? new Date(d.t).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' }) : '';
  return h('div', { cls: 'draft' },
    h('div', { cls: 'draft-top' },
      h('div', { cls: 'draft-ic' }, svgIcon(ICONS.edit, 20)),
      h('div', { cls: 'draft-tx' },
        h('div', { cls: 'draft-k' }, 'טיוטה פעילה'),
        h('div', { cls: 'draft-t' }, ttl),
        h('div', { cls: 'sub-muted' }, 'שלב ' + (d.i + 1) + (when ? ' · ' + when : ''))
      )
    ),
    h('div', { cls: 'draft-act' },
      h('button', { type: 'button', cls: 'btn ok', onclick: resume }, 'המשך טיוטה'),
      h('button', { type: 'button', cls: 'btn ghost del', ...(pendDelDraft ? { style: 'background:var(--er);color:#fff' } : {}), onclick: delDraft }, pendDelDraft ? 'בטוח? מחק' : 'מחיקה')
    )
  );
};

function delDraft() {
  if (!pendDelDraft) {
    pendDelDraft = true;
    setTimeout(() => { if (pendDelDraft) { pendDelDraft = false; if (i < 0) draw(); } }, 4000);
    draw();
    return;
  }
  pendDelDraft = false;
  draft = null;
  idb('del', 'draft').catch(e => console.warn('Could not delete draft from IndexedDB:', e));
  try { localStorage.removeItem('draft'); } catch (e) {}
  draw();
}

function newRep() {
  Object.keys(S).forEach(k => delete S[k]);
  S.date = new Date().toLocaleDateString('sv-SE');
  saved = null;
  editingId = null;
  viewingWork = null;
  hd = 0;
  i = 0;
  errs = [];
  draw();
  scrollTo(0, 0);
}

function resume() {
  Object.keys(S).forEach(k => delete S[k]);
  Object.assign(S, draft.S);
  i = draft.i;
  hd = 0;
  saved = null;
  editingId = null;
  viewingWork = null;
  errs = [];
  try { for (let q = 0; q < i; q++) { history.pushState(null, ''); hd++; } } catch (e) {}
  draw();
  scrollTo(0, 0);
}

draw();
Promise.all([idb('get', 'draft'), idb('get', 'saved_works')]).then(([d, works]) => {
  if (!(d && d.S)) {
    try { d = JSON.parse(localStorage.getItem('draft')); } catch (e) { d = null; }
  }
  if (d && d.S) draft = d;

  if (Array.isArray(works)) {
    savedWorks = works;
  } else {
    try {
      const lite = JSON.parse(localStorage.getItem('reports_lite') || '[]');
      if (Array.isArray(lite)) {
        savedWorks = lite;
        if (lite.length) toast('נטענה רשימת שחזור חלקית בלבד. גיבוי JSON מלא שומר גם תמונות ונתוני עריכה.');
      }
    } catch (e) {}
  }
  if (i < 0) draw();
}).catch(err => {
  console.error('Database initialization failed:', err);
  try {
    const d = JSON.parse(localStorage.getItem('draft') || 'null');
    if (d && d.S) draft = d;
    const lite = JSON.parse(localStorage.getItem('reports_lite') || '[]');
    if (Array.isArray(lite)) savedWorks = lite;
  } catch (e) {}
  toast('האחסון המלא אינו זמין. רשימת השחזור המקומית, אם קיימת, חלקית בלבד.');
  if (i < 0) draw();
});
